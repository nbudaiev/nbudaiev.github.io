  const X0=nx(xr[0]),X1=nx(xr[1]),Y0=ny(yr[0]),Y1=ny(yr[1]),Zt=nz(ZC[0]),Zb=nz(ZC[1]);
  // bounding box
  const cs=[[X0,Y0],[X1,Y0],[X1,Y1],[X0,Y1]];
  for(let i=0;i<4;i++){const a=cs[i],b=cs[(i+1)%4];
    line(proj(a[0],a[1],Zt),proj(b[0],b[1],Zt),rule,1);line(proj(a[0],a[1],Zb),proj(b[0],b[1],Zb),rule,1);
    line(proj(a[0],a[1],Zt),proj(a[0],a[1],Zb),rule,1);}
  // depth ticks on one vertical edge
  for(let z=1;z<=8;z++){const p=proj(X0,Y0,nz(z));line(p,[p[0]-5,p[1]],mute,1);text([p[0]-8,p[1]+4],z.toString(),mute,'right');}
  {const p=proj(X0,Y0,nz(4.5));ctx.save();ctx.translate(p[0]-30,p[1]);ctx.rotate(-Math.PI/2);text([0,0],'A_Ks (depth) →',ink);ctx.restore();}
  // sky ticks along bottom edges
  for(let x=Math.ceil(xr[0]/50)*50;x<=xr[1];x+=50){const p=proj(nx(x),Y0,Zb);text([p[0],p[1]+14],x+'″',mute);}
  for(let y=Math.ceil(yr[0]/50)*50;y<=yr[1];y+=50){const p=proj(X1,ny(y),Zb);text([p[0]+6,p[1]+4],y+'″',mute,'left');}
  const pe=proj(X0,Y0,Zb), pw=proj(X1,Y0,Zb), pn=proj(X1,Y1,Zb);
  text([(pe[0]+pw[0])/2,(pe[1]+pw[1])/2+30],'Δα cosδ (east ←)',ink);
  text([(pw[0]+pn[0])/2+40,(pw[1]+pn[1])/2+16],'Δδ (north)',ink);
  // stars: depth-sorted
  const pmin=+pmin_.value, zlo=+zmin_.value, zhi=+zmax_.value;
  vis=[];
  for(let i=0;i<N;i++){if(P.p[i]<pmin||P.z[i]<zlo||P.z[i]>zhi)continue;
    const q=proj(nx(P.x[i]),ny(P.y[i]),nz(P.z[i]));vis.push([q[2],q[0],q[1],i]);}
  vis.sort((a,b)=>b[0]-a[0]);
  for(const [d,x,y,i] of vis){ctx.fillStyle=col(P.z[i]);ctx.globalAlpha=0.35+0.6*P.p[i];
    ctx.beginPath();ctx.arc(x,y,i===hover?5:2.4,0,6.2832);ctx.fill();}
  ctx.globalAlpha=1;
  if(hover>=0){const q=proj(nx(P.x[hover]),ny(P.y[hover]),nz(P.z[hover]));ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q[0],q[1],6,0,6.2832);ctx.stroke();}
  // Sgr B2 cores
  for(const [n,[x,y]] of Object.entries(S)){const a=proj(nx(x),ny(y),Zt),b=proj(nx(x),ny(y),Zb);
    line(a,b,acc,2);ctx.font='bold 12px -apple-system,Helvetica,Arial,sans-serif';text([a[0],a[1]-6],n,acc);ctx.font='11px -apple-system,Helvetica,Arial,sans-serif';}
  // colour bar
  const bx=W-26, by=40, bh=Math.min(220,H-80);
  for(let k=0;k<bh;k++){ctx.fillStyle=col(CLO+(CHI-CLO)*k/bh);ctx.fillRect(bx,by+k,12,1.5);}
  ctx.strokeStyle=rule;ctx.strokeRect(bx,by,12,bh);
  for(const v of [2,3,4,5,6,7]){const yy=by+bh*(v-CLO)/(CHI-CLO);text([bx-4,yy+4],v,mute,'right');}
  text([bx+6,by-10],'A_Ks',ink);
  text([10,H-10],vis.length+' stars shown',mute,'left');
}
const pmin_=document.getElementById('pmin'), zmin_=document.getElementById('zmin'), zmax_=document.getElementById('zmax');
function upd(){if(+zmin_.value>+zmax_.value)zmax_.value=zmin_.value;
  document.getElementById('pv').textContent=(+pmin_.value).toFixed(2);
  document.getElementById('zlo').textContent=(+zmin_.value).toFixed(2);
  document.getElementById('zhi').textContent=(+zmax_.value).toFixed(2);draw();}
[pmin_,zmin_,zmax_].forEach(e=>e.addEventListener('input',upd));
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointermove',e=>{
  if(drag){yaw+=(e.clientX-drag[0])*0.008;pitch=Math.max(-0.2,Math.min(1.57,pitch+(e.clientY-drag[1])*0.008));
    drag=[e.clientX,e.clientY];tip.style.display='none';hover=-1;draw();return;}
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let best=-1,bd=64;
  for(const [d,x,y,i] of vis){const dd=(x-mx)**2+(y-my)**2;if(dd<bd){bd=dd;best=i;}}
  if(best!==hover){hover=best;draw();}
  if(best>=0){tip.innerHTML=`RA ${P.ra[best].toFixed(5)}, Dec ${P.dec[best].toFixed(5)}<br>A<sub>Ks</sub> ${P.z[best].toFixed(2)} · F212N ${P.m212[best]} · F212N−F480M ${P.col[best]}<br>p<sub>RC</sub> ${P.p[best]}`;
    tip.style.display='block';tip.style.left=Math.min(mx+14,r.width-260)+'px';tip.style.top=(my+14)+'px';}
  else tip.style.display='none';});
cv.addEventListener('pointerleave',()=>{tip.style.display='none';if(hover>=0){hover=-1;draw();}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.4,Math.min(5,zoom*Math.exp(-e.deltaY*0.001)));draw();},{passive:false});
document.getElementById('top').onclick=()=>{yaw=0;pitch=1.5707;draw();};
document.getElementById('side').onclick=()=>{yaw=0;pitch=0;draw();};
document.getElementById('reset').onclick=()=>{yaw=-1.25;pitch=0.3;zoom=1;draw();};
function tick(){if(document.getElementById('spin').checked){yaw+=0.004;draw();}requestAnimationFrame(tick);}
window.addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
upd();tick();
</script>
